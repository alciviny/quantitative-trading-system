[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "co-piloto-quant"
version = "0.1.0"
description = "Um sistema de suporte à decisão para análise de ativos financeiros."
authors = [{ name = "Seu Nome", email = "seu@email.com" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "yfinance>=0.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "plotly>=5.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "ta>=0.11.0",
    "TA-Lib>=0.6.0",
    "vectorbt>=0.26.0",
    "joblib>=1.3.0",
    "MetaTrader5>=5.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.8.0",
]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]